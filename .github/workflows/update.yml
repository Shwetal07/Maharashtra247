name: Update news
on:
  schedule: [{cron: "*/15 * * * *"}]
  push: {paths: ["manual.json", "feeds.json"]}
  workflow_dispatch:
permissions: {contents: write}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt && python fetch_news.py
      - run: |
          git config user.name "news-bot"; git config user.email "bot@users.noreply.github.com"
          for f in news.json sitemap.xml robots.txt; do [ -f "$f" ] && git add "$f"; done; [ -d a ] && git add -A a; git commit -m "update news" || exit 0; git pull --rebase -q || true; git push
